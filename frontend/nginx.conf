server {
  listen 8080;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https:; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';";
  index index.html;

  location ~* \.map$ {
    deny all;
  }

  location / {
    try_files $uri $uri/ /index.html;  # SPA fallback
  }

  location /api/ {
    proxy_pass http://backend:3001;    # forward API calls to backend service
  }
}
